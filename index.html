        async function generateQuantitativeCategorySummary() {
            const contentDiv = document.getElementById('aiCategorySummaryContent');
            const btn = document.getElementById('generateAiSummaryBtn');

            btn.style.display = 'none';
            contentDiv.innerHTML = `
                <div style="text-align: center; padding: 20px 0;">
                    <div class="loading-spinner"></div>
                    <span>系統正在計算量化數據，請稍候...</span>
                </div>
            `;

            try {
                if (currentSubCategoryDataForAi.length === 0) {
                    throw new Error("沒有足夠的歷史數據可供分析");
                }

                let totalEvents = currentSubCategoryDataForAi.length;

                // Timeframes to analyze
                const timeframes = [1, 3, 7, 15, 30];
                const metrics = {};

                timeframes.forEach(t => {
                    metrics[t] = {
                        validCount: 0,
                        upCount: 0,
                        sum: 0,
                        upSum: 0,
                        downSum: 0,
                        maxGain: -Infinity,
                        maxLoss: Infinity,
                        maxGainName: '',
                        maxLossName: ''
                    };
                });

                currentSubCategoryDataForAi.forEach(d => {
                    timeframes.forEach(t => {
                        const key = `day${t}ChangePct`;
                        if (d[key] !== null && d[key] !== undefined) {
                            const val = parseFloat(d[key]);
                            metrics[t].validCount++;
                            metrics[t].sum += val;

                            if (val >= 0) {
                                metrics[t].upCount++;
                                metrics[t].upSum += val;
                            } else {
                                metrics[t].downSum += val;
                            }

                            if (val > metrics[t].maxGain) {
                                metrics[t].maxGain = val;
                                metrics[t].maxGainName = d.name;
                            }
                            if (val < metrics[t].maxLoss) {
                                metrics[t].maxLoss = val;
                                metrics[t].maxLossName = d.name;
                            }
                        }
                    });
                });

                if (metrics[7].validCount === 0) {
                    throw new Error("目前事件尚無足夠的未來價格資料可供統計。");
                }

                // Process metrics
                const processed = {};
                timeframes.forEach(t => {
                    const m = metrics[t];
                    if (m.validCount > 0) {
                        const winRate = m.upCount / m.validCount;
                        const avgReturn = m.sum / m.validCount;
                        const avgWin = m.upCount > 0 ? m.upSum / m.upCount : 0;
                        const avgLoss = (m.validCount - m.upCount) > 0 ? m.downSum / (m.validCount - m.upCount) : 0;

                        // Risk/Reward ratio (abs(avgWin) / abs(avgLoss))
                        let rrRatio = 0;
                        if (avgLoss !== 0) {
                            rrRatio = Math.abs(avgWin / avgLoss);
                        }

                        // Expected Value (EV) = (Win Rate * Avg Win) + (Loss Rate * Avg Loss)
                        const ev = (winRate * avgWin) + ((1 - winRate) * avgLoss);

                        processed[t] = {
                            winRate: (winRate * 100).toFixed(0),
                            avgReturn: avgReturn.toFixed(2),
                            avgWin: avgWin.toFixed(2),
                            avgLoss: avgLoss.toFixed(2),
                            rrRatio: rrRatio > 0 ? rrRatio.toFixed(2) : '-',
                            ev: ev.toFixed(2),
                            maxGain: m.maxGain,
                            maxLoss: m.maxLoss,
                            maxGainName: m.maxGainName,
                            maxLossName: m.maxLossName
                        };
                    } else {
                        processed[t] = null;
                    }
                });

                // Determine Pattern Trait based on Short (3d) vs Medium (15d/30d)
                let patternLabel = "震盪不明";
                let patternColor = "#FF9800";

                const shortAvg = processed[3] ? parseFloat(processed[3].avgReturn) : 0;
                const medAvg = processed[15] ? parseFloat(processed[15].avgReturn) : (processed[30] ? parseFloat(processed[30].avgReturn) : 0);

                if (shortAvg > 2 && medAvg > 4) {
                    patternLabel = "🔥 動能強勁 (持續上漲)";
                    patternColor = "#00c087";
                } else if (shortAvg < -2 && medAvg < -4) {
                    patternLabel = "🩸 動能延續 (持續下跌)";
                    patternColor = "#ff4b4b";
                } else if (shortAvg > 2 && medAvg < -1) {
                    patternLabel = "🎭 獲利了結 (先漲後跌/利多出盡)";
                    patternColor = "#ff9800";
                } else if (shortAvg < -2 && medAvg > 1) {
                    patternLabel = "🚀 利空出盡 (先跌後漲/利空買入)";
                    patternColor = "#2962ff";
                } else if (Math.abs(shortAvg) <= 2 && Math.abs(medAvg) <= 2) {
                    patternLabel = "⚖️ 影響中性 (盤整震盪)";
                    patternColor = "#787b86";
                }

                let warningHtml = "";
                if (totalEvents < 3) {
                    warningHtml = `<div style="background: rgba(255,75,75,0.1); border: 1px solid rgba(255,75,75,0.3); color: #ff4b4b; padding: 6px 10px; border-radius: 4px; font-size: 12px; margin-bottom: 12px;">⚠️ 警告：歷史樣本數小於 3，統計數據參考價值有限。</div>`;
                }

                // Generate Table Rows
                let tableRows = '';
                timeframes.forEach(t => {
                    const p = processed[t];
                    if (p) {
                        const winColor = parseFloat(p.winRate) >= 50 ? '#00c087' : '#ff4b4b';
                        const evColor = parseFloat(p.ev) >= 0 ? '#00c087' : '#ff4b4b';
                        const avgColor = parseFloat(p.avgReturn) >= 0 ? '#00c087' : '#ff4b4b';

                        tableRows += `
                            <tr style="border-bottom: 1px solid #2b313f;">
                                <td style="padding: 6px 8px; color: #d1d4dc;">T+${t}</td>
                                <td style="padding: 6px 8px; color: ${winColor};">${p.winRate}%</td>
                                <td style="padding: 6px 8px; color: ${avgColor};">${p.avgReturn > 0 ? '+'+p.avgReturn : p.avgReturn}%</td>
                                <td style="padding: 6px 8px; color: #00c087;">+${p.avgWin}%</td>
                                <td style="padding: 6px 8px; color: #ff4b4b;">${p.avgLoss}%</td>
                                <td style="padding: 6px 8px; color: #e1e3e6;">${p.rrRatio}</td>
                                <td style="padding: 6px 8px; color: ${evColor}; font-weight: bold;">${p.ev > 0 ? '+'+p.ev : p.ev}%</td>
                            </tr>
                        `;
                    }
                });

                // Tail Risk (Using 7-day data as standard for short-term tail risk)
                let tailRiskHtml = '';
                if (processed[7]) {
                    const p7 = processed[7];
                    tailRiskHtml = `
                        <div style="background: rgba(30, 34, 45, 0.6); padding: 10px; border-radius: 6px; font-size: 12px; margin-top: 10px; border: 1px solid #2b313f;">
                            <div style="color: #888; margin-bottom: 6px;">⚠️ 歷史極端值 (7天內最大暴風半徑)</div>
                            <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
                                <span>🟢 最佳表現: <span style="color: #d1d4dc;">${p7.maxGainName}</span></span>
                                <span style="color: #00c087; font-weight: bold;">+${p7.maxGain.toFixed(2)}%</span>
                            </div>
                            <div style="display: flex; justify-content: space-between;">
                                <span>🔴 最差表現: <span style="color: #d1d4dc;">${p7.maxLossName}</span></span>
                                <span style="color: #ff4b4b; font-weight: bold;">${p7.maxLoss.toFixed(2)}%</span>
                            </div>
                        </div>
                    `;
                }


                const htmlContent = `
                    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px;">
                        <h3 style="color: #fff; margin: 0;">📊 專業量化報告</h3>
                        <span style="font-size: 12px; color: #888;">樣本數: ${totalEvents} 筆</span>
                    </div>
                    ${warningHtml}

                    <div style="margin-bottom: 12px; display: inline-block; background: ${patternColor}20; border: 1px solid ${patternColor}50; color: ${patternColor}; padding: 4px 10px; border-radius: 12px; font-size: 13px; font-weight: bold;">
                        ${patternLabel}
                    </div>

                    <div style="overflow-x: auto;">
                        <table style="width: 100%; border-collapse: collapse; text-align: right; font-size: 12px;">
                            <thead>
                                <tr style="background: #131722; color: #787b86; border-bottom: 1px solid #434651;">
                                    <th style="padding: 6px 8px; text-align: left; font-weight: normal; position: static;">週期</th>
                                    <th style="padding: 6px 8px; font-weight: normal; position: static;">勝率</th>
                                    <th style="padding: 6px 8px; font-weight: normal; position: static;">平均報酬</th>
                                    <th style="padding: 6px 8px; font-weight: normal; position: static;">平均獲利</th>
                                    <th style="padding: 6px 8px; font-weight: normal; position: static;">平均虧損</th>
                                    <th style="padding: 6px 8px; font-weight: normal; position: static;">盈虧比</th>
                                    <th style="padding: 6px 8px; font-weight: normal; position: static;">期望值</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${tableRows}
                            </tbody>
                        </table>
                    </div>
                    ${tailRiskHtml}
                `;

                contentDiv.innerHTML = htmlContent;

            } catch (error) {
                console.error("量化總結失敗:", error);
                contentDiv.innerHTML = `
                    <div style="color: #ff4b4b; padding: 10px 0; text-align: center;">
                        <span>❌ 分析失敗: ${error.message}</span>
                    </div>
                `;
                btn.style.display = 'block';
                btn.innerText = '重試';
            }
        }

        function closeSubCategoryModal() {
            document.getElementById('subCategoryModal').classList.remove('active');
        }

        function focusEvent(timestamp) {
            // Find the logical index of the timestamp in klineData
            if (!klineData || klineData.length === 0) return;

            // Try to find exact match
            let targetIndex = klineData.findIndex(d => d.time === timestamp);

            // If exact match not found (maybe weekend/holiday), find the closest one
            if (targetIndex === -1) {
                let minDiff = Infinity;
                for (let i = 0; i < klineData.length; i++) {
                    const diff = Math.abs(klineData[i].time - timestamp);
                    if (diff < minDiff) {
                        minDiff = diff;
                        targetIndex = i;
                    }
                }
            }

            if (targetIndex !== -1) {
                // Determine visible range (e.g., 60 bars total, centered on event)
                const rangeHalf = 30;
                let from = Math.max(0, targetIndex - rangeHalf);
                let to = Math.min(klineData.length - 1, targetIndex + rangeHalf);

                chart.timeScale().setVisibleLogicalRange({ from, to });
            }
        }

        // Asset Switching Logic
        function switchSymbol(symbol) {
            if (currentSymbol === symbol) return;
            currentSymbol = symbol;

            // Update tabs UI
            document.querySelectorAll('.symbol-tab').forEach(tab => tab.classList.remove('active'));
            document.getElementById(`tab-${symbol}`).classList.add('active');

            // Re-fetch data
            fetchAllData(symbol, currentInterval);
        }

        // Interval Switching Logic
        function switchInterval(interval) {
            if (currentInterval === interval) return;
            currentInterval = interval;

            // Update interval tabs UI
            document.querySelectorAll('.interval-tab').forEach(tab => tab.classList.remove('active'));
            document.getElementById(`interval-${interval}`).classList.add('active');

            // 隱藏事件卡片並重置選擇
            document.getElementById('event-overlay').classList.remove('active');
            currentEventTime = null;

            // Re-fetch data. Focus time is null so we get the most recent for smaller timeframes.
            fetchAllData(currentSymbol, currentInterval);
        }

        // Modal Functions
        function openModal() {
            document.getElementById('reportModal').classList.add('active');
        }

        function closeModal(e) {
            // Only close if clicking the backdrop (reportModal itself) or the close button (e is undefined)
            if (e && e.target && e.target.id !== 'reportModal') return;
            document.getElementById('reportModal').classList.remove('active');
        }

        // Populate Categories Dropdown
        const categorySelect = document.getElementById('event-category-select');
        categories.forEach(cat => {
            const option = document.createElement('option');
            option.value = cat;
            option.innerText = cat;
            categorySelect.appendChild(option);
        });

        const buttonContainer = document.getElementById('event-buttons');

        function renderEventButtons(categoryFilter = 'all') {
            // Keep the "全貌視角" button
            buttonContainer.innerHTML = `
                <button class="control-btn" onclick="resetZoom()">全貌視角</button>
            `;

            const filteredEvents = categoryFilter === 'all' ? events : events.filter(e => e.category === categoryFilter);

            filteredEvents.forEach(event => {
                const btn = document.createElement('button');
                btn.className = 'control-btn';
                btn.innerText = `對焦: ${event.name}`;
                btn.onclick = () => jumpToEvent(event.date);
                buttonContainer.appendChild(btn);
            });
        }

        categorySelect.addEventListener('change', (e) => {
            renderEventButtons(e.target.value);
            updateCategoryStats(e.target.value, window._cachedDailyData && window._cachedDailyData.length > 0 ? window._cachedDailyData : (typeof dailyData !== 'undefined' && dailyData.length > 0 ? dailyData : klineData));
            renderHtmlMarkers(null);
            document.getElementById('event-overlay').classList.remove('active');
            currentEventTime = null;
        });

        function updateCategoryStats(categoryFilter = 'all', backgroundData = null) {
            const statsEl = document.getElementById('category-stats');
            const dataSource = backgroundData && backgroundData.length > 0 ? backgroundData : klineData;
            if (dataSource.length === 0) {
                statsEl.innerText = '';
                return;
            }

            const filteredEvents = categoryFilter === 'all' ? events : events.filter(e => e.category === categoryFilter);

            let upCount = 0;
            let downCount = 0;
            let totalEvaluated = 0;

            filteredEvents.forEach(event => {
                const targetTime = new Date(event.date).getTime() / 1000;
                const currentData = findPriceAfterDays(dataSource, targetTime, 0);
                const day7Data = findPriceAfterDays(dataSource, targetTime, 7);

                if (currentData && day7Data) {
                    totalEvaluated++;
                    if (day7Data.close >= currentData.close) {
                        upCount++;
                    } else {
                        downCount++;
                    }
                }
            });

            if (totalEvaluated > 0) {
                const upProb = ((upCount / totalEvaluated) * 100).toFixed(0);
                const downProb = ((downCount / totalEvaluated) * 100).toFixed(0);
                statsEl.innerHTML = ` ( 7天後統計: <span style="color:#00c087">上漲 ${upProb}%</span> / <span style="color:#ff4b4b">下跌 ${downProb}%</span> )`;
            } else {
                statsEl.innerHTML = ` ( 7天後統計: 尚無完整資料 )`;
            }
        }

        // Initial Render
        renderEventButtons('all');

        // 執行抓取
        fetchAllData(currentSymbol, currentInterval);


        // Store marker elements to update positions efficiently
        let markerElements = [];

        function renderHtmlMarkers(eventToFocus = null) {
            const container = document.getElementById('html-markers-container');
            container.innerHTML = '';
            markerElements = [];

            if (!eventToFocus) return;

            const targetTime = new Date(eventToFocus.date).getTime() / 1000;

            const wrapper = document.createElement('div');
            wrapper.className = 'html-marker-wrapper';

            const line = document.createElement('div');
            line.className = 'html-marker-line';

            const btn = document.createElement('div');
            btn.className = 'html-marker-btn';
            btn.innerText = eventToFocus.name;
            btn.style.top = '15%';
            btn.classList.add('active');

            btn.onclick = (e) => {
                e.stopPropagation();
                showEventCard(eventToFocus);
            };

            wrapper.appendChild(line);
            wrapper.appendChild(btn);
            container.appendChild(wrapper);

            markerElements.push({
                el: wrapper,
                btn: btn,
                time: targetTime,
                event: eventToFocus
            });

            updateHtmlMarkersPosition();
        }

        function updateHtmlMarkersPosition() {
            const chartContainer = document.getElementById('chart-container');
            if (!chartContainer) return;
            const chartWidth = chartContainer.clientWidth;

            markerElements.forEach(marker => {
                const x = chart.timeScale().timeToCoordinate(marker.time);

                // If coordinate is valid and within visible area (plus slight buffer)
                if (x !== null && x > -50 && x < chartWidth + 50) {
                    marker.el.style.left = `${x}px`;
                    marker.el.classList.add('visible');

                    // Highlight the currently focused event's marker
                    if (currentEventTime === marker.time) {
                        marker.btn.classList.add('active');
                    } else {
                        marker.btn.classList.remove('active');
                    }
                } else {
                    marker.el.classList.remove('visible');
                }
            });
        }

        let currentEventTime = null; // Track currently focused event time

        function updateOverlayPosition() {
            const overlay = document.getElementById('event-overlay');
            const line = document.getElementById('event-overlay-line');
            if (!overlay.classList.contains('active') || !currentEventTime) {
                line.style.opacity = '0';
                return;
            }

            // Convert time to x coordinate on the chart
            const x = chart.timeScale().timeToCoordinate(currentEventTime);

            // Check if coordinate is valid and visible
            const chartContainer = document.getElementById('chart-container');
            const chartWidth = chartContainer.clientWidth;

            if (x === null || x < 0 || x > chartWidth) {
                line.style.opacity = '0';
                return;
            }

            // Show line and position it
            line.style.opacity = '1';
            line.style.left = `${x}px`;
        }

        // Update overlay position on scroll/zoom
        chart.timeScale().subscribeVisibleTimeRangeChange(() => {
            updateOverlayPosition();
            updateHtmlMarkersPosition();
        });

        // Drag and Drop Logic for Event Card
        const eventCard = document.querySelector('.event-overlay-card');
        let isDragging = false;
        let dragStartX, dragStartY;
        let initialCardLeft, initialCardTop;

        function startDrag(e) {
            // Prevent dragging if clicking the close button or nav buttons
            if (e.target.closest('.event-overlay-close-btn') || e.target.closest('.event-overlay-nav') || e.target.closest('.event-reason-toggle') || e.target.closest('.event-reason-content')) return;

            isDragging = true;

            // Handle both touch and mouse events
            const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;

            dragStartX = clientX;
            dragStartY = clientY;

            // If dragging for the first time, convert right to left using offsetLeft
            if (!eventCard.style.left || eventCard.style.left === 'auto') {
                eventCard.style.left = eventCard.offsetLeft + 'px';
                eventCard.style.right = 'auto'; // Disable right
            }
            if (!eventCard.style.top || eventCard.style.top === 'auto') {
                eventCard.style.top = eventCard.offsetTop + 'px';
            }

            initialCardLeft = parseFloat(eventCard.style.left);
            initialCardTop = parseFloat(eventCard.style.top);

            // Prevent default behavior to avoid text selection
            if(e.type === 'mousedown') e.preventDefault();
        }

        function doDrag(e) {
            if (!isDragging) return;

            // Prevent scrolling on touch devices while dragging
            if(e.type === 'touchmove') e.preventDefault();

            const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;

            const deltaX = clientX - dragStartX;
            const deltaY = clientY - dragStartY;

            eventCard.style.left = (initialCardLeft + deltaX) + 'px';
            eventCard.style.top = (initialCardTop + deltaY) + 'px';
        }

        function endDrag() {
            isDragging = false;
        }

        eventCard.addEventListener('mousedown', startDrag);
        document.addEventListener('mousemove', doDrag);
        document.addEventListener('mouseup', endDrag);

        eventCard.addEventListener('touchstart', startDrag, { passive: false });
        document.addEventListener('touchmove', doDrag, { passive: false });
        document.addEventListener('touchend', endDrag);

        async function jumpToEvent(dateString) {
            const event = events.find(e => e.date === dateString);
            if (!event) return;

            const targetTime = new Date(dateString).getTime() / 1000;

            // 如果當前是小級別 (不是 1d 或 1w)，檢查目標時間是否在當前載入的資料範圍內
            if (currentInterval !== '1d' && currentInterval !== '1w') {
                const hasDataForEvent = klineData.length > 0 &&
                                        targetTime >= klineData[0].time &&
                                        targetTime <= klineData[klineData.length - 1].time;

                // 如果沒有資料，觸發重新抓取並聚焦
                if (!hasDataForEvent) {
                    await fetchAllData(currentSymbol, currentInterval, targetTime * 1000);
                }
            }

            // Set chart range based on interval
            let visibleBefore = 7 * 24 * 60 * 60;
            let visibleAfter = 23 * 24 * 60 * 60;

            if (currentInterval === '15m') {
                visibleBefore = 12 * 60 * 60; // 12 hours
                visibleAfter = 24 * 60 * 60;  // 24 hours
            } else if (currentInterval === '1h') {
                visibleBefore = 2 * 24 * 60 * 60; // 2 days
                visibleAfter = 5 * 24 * 60 * 60;  // 5 days
            } else if (currentInterval === '4h') {
                visibleBefore = 4 * 24 * 60 * 60; // 4 days
                visibleAfter = 10 * 24 * 60 * 60; // 10 days
            }

            chart.timeScale().setVisibleRange({ from: targetTime - visibleBefore, to: targetTime + visibleAfter });
            renderHtmlMarkers(event);
            showEventCard(event);
            document.getElementById('reportModal').classList.remove('active');
        }

        function resetZoom() {
            chart.timeScale().fitContent();
            renderHtmlMarkers(null);
            document.getElementById('event-overlay').classList.remove('active');
            currentEventTime = null;
        }

        function closeEventCard(event) {
            if (event) {
                event.stopPropagation();
            }
            document.getElementById('event-overlay').classList.remove('active');
            currentEventTime = null;
            renderHtmlMarkers(null);
        }

        function toggleEventReason() {
            const content = document.getElementById('overlay-reason-content');
            content.classList.toggle('active');
        }

        async function showEventCard(event) {
            const targetTime = new Date(event.date).getTime() / 1000;
            const targetTimeMs = targetTime * 1000;

            const currentData = findPriceAfterDays(klineData, targetTime, 0);
            const dailyData = dailyKlineDataCache[currentSymbol] || klineData;
            const day7Data = findPriceAfterDays(dailyData, targetTime, 7);

            const titleEl = document.getElementById('overlay-title');
            const dateEl = document.getElementById('overlay-date');
            const changeEl = document.getElementById('overlay-change');
            const statsEl = document.getElementById('overlay-candle-stats');

            titleEl.innerText = event.name;
            dateEl.innerText = event.date;

            if (currentData && day7Data) {
                const diff = day7Data.close - currentData.close;
                const percent = ((diff / currentData.close) * 100).toFixed(2);
                const isUp = diff >= 0;
                const sign = isUp ? '+' : '';
                changeEl.className = 'event-overlay-change ' + (isUp ? 'up' : 'down');
                changeEl.innerText = `7天後: ${sign}${percent}%`;
            } else {
                changeEl.className = 'event-overlay-change';
                changeEl.innerText = '7天後: 無資料';
                changeEl.style.color = '#787b86';
            }

            if (currentData) {
                const amplitude = ((currentData.high - currentData.low) / currentData.low) * 100;
                const candleChange = currentData.close - currentData.open;
                const candlePercent = (candleChange / currentData.open) * 100;
                const isCandleUp = candleChange >= 0;
                const candleSign = isCandleUp ? '+' : '';
                const candleColor = isCandleUp ? '#00c087' : '#ff4b4b';

                statsEl.innerHTML = `
                    <div style="color: #787b86;">當根K線 (${currentInterval})</div>
                    <div>收盤: $${currentData.close.toLocaleString(undefined, {maximumFractionDigits:0})}</div>
                    <div>漲跌: <span style="color: ${candleColor}">${candleSign}${candlePercent.toFixed(2)}%</span></div>
                    <div>振幅: ${amplitude.toFixed(2)}%</div>
                `;
                statsEl.style.display = 'flex';
            } else {
                statsEl.style.display = 'none';
            }

            currentEventTime = targetTime;


            if (event.reason) {
                document.getElementById('overlay-reason-content').innerText = event.reason;
                document.getElementById('overlay-reason-toggle').style.display = 'block';
                // Reset to hidden on new event
                document.getElementById('overlay-reason-content').classList.remove('active');
            } else {
                document.getElementById('overlay-reason-toggle').style.display = 'none';
                document.getElementById('overlay-reason-content').classList.remove('active');
            }

            // Timeline Navigation Logic
            const currentFilter = document.getElementById('event-category-select').value;
            const filteredEvents = currentFilter === 'all' ? events : events.filter(e => e.category === currentFilter);

            // Sort events by date to ensure proper timeline
            const sortedEvents = [...filteredEvents].sort((a, b) => new Date(a.date) - new Date(b.date));
            const currentIndex = sortedEvents.findIndex(e => e.date === event.date);

            const prevBtn = document.getElementById('nav-prev-btn');
            const nextBtn = document.getElementById('nav-next-btn');

            if (prevBtn && nextBtn) {
                if (currentIndex > 0) {
                    prevBtn.disabled = false;
                    prevBtn.dataset.targetDate = sortedEvents[currentIndex - 1].date;
                } else {
                    prevBtn.disabled = true;
                    prevBtn.dataset.targetDate = '';
                }

                if (currentIndex !== -1 && currentIndex < sortedEvents.length - 1) {
                    nextBtn.disabled = false;
                    nextBtn.dataset.targetDate = sortedEvents[currentIndex + 1].date;
                } else {
                    nextBtn.disabled = true;
                    nextBtn.dataset.targetDate = '';
                }
            }

            const overlay = document.getElementById('event-overlay');
            const card = document.querySelector('.event-overlay-card');

            // Reset position to top-right on new open
            card.style.top = '20px';
            card.style.right = '20px';
            card.style.left = 'auto';

            overlay.classList.add('active');
            updateOverlayPosition();
        }

        function navigateEvent(direction, e) {
            // Prevent event card from hiding automatically during navigation or dragging
            if (e) e.stopPropagation();

            const btn = document.getElementById(`nav-${direction}-btn`);
            if (btn && btn.dataset.targetDate && !btn.disabled) {
                jumpToEvent(btn.dataset.targetDate);
            }
        }

        // Event listener for clicking on the chart to hide event cards
        // The markers themselves handle showing the cards via standard DOM clicks.
        chart.subscribeClick((param) => {
            document.getElementById('event-overlay').classList.remove('active');
            currentEventTime = null;
            renderHtmlMarkers(null);
        });

        window.addEventListener('resize', () => {
            const headerHeight = document.querySelector('.header').offsetHeight;
            chart.resize(window.innerWidth, window.innerHeight - headerHeight);
            updateHtmlMarkersPosition();
        });

        // Initial call to set correct height
        setTimeout(() => {
            const headerHeight = document.querySelector('.header').offsetHeight;
            chart.resize(window.innerWidth, window.innerHeight - headerHeight);
        }, 0);
    </script>
</body>
