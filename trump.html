<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TRUMP CODE - Global Market Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="app-container">
    <header class="dashboard-header">
        <h1>MARKET<span class="highlight">DASH</span></h1>
        <p class="subtitle">Global Macro Indicators</p>

        <!-- Navigation Tabs -->
        <nav class="nav-tabs">
            <a href="index.html" class="nav-tab">全球總經</a>
            <a href="trump.html" class="nav-tab active">川普密碼</a>
        </nav>

        <div class="cache-notice">
            <p>💡 AI 即時分析川普 Truth Social 貼文與市場連動</p>
        </div>
    </header>

    <main class="indicators-container">

        <!-- Live Status Card -->
        <section class="indicator-card glass-panel">
            <div class="card-header">
                <div class="title-group">
                    <h2>即時狀態 <span class="badge">LIVE</span></h2>
                    <span class="desc-short">系統運算與目前預測</span>
                </div>
            </div>
            <div class="status-grid">
                <div class="status-box">
                    <span class="status-label">系統健康度</span>
                    <strong class="status-value text-neutral" id="s-health">--</strong>
                </div>
                <div class="status-box">
                    <span class="status-label">今日推文</span>
                    <strong class="status-value" id="s-posts">--</strong>
                </div>
                <div class="status-box">
                    <span class="status-label">預測方向</span>
                    <strong class="status-value text-neutral" id="s-trend">--</strong>
                </div>
                <div class="status-box">
                    <span class="status-label">歷史勝率</span>
                    <strong class="status-value" style="color: var(--accent-neon);" id="s-hit">--%</strong>
                </div>
            </div>
        </section>

        <!-- Recent Posts Card -->
        <section class="indicator-card glass-panel">
            <div class="card-header">
                <div class="title-group">
                    <h2>最新推文 <span class="badge">LIVE</span></h2>
                    <span class="desc-short">川普最新貼文與信號解析</span>
                </div>
            </div>
            <div id="posts-area" class="posts-list">
                <span class="skeleton" style="width: 100%; height: 100px;"></span>
                <span class="skeleton" style="width: 100%; height: 100px;"></span>
            </div>
        </section>

        <!-- Signals Card -->
        <section class="indicator-card glass-panel">
            <div class="card-header">
                <div class="title-group">
                    <h2>歷史信號 <span class="badge">DATA</span></h2>
                    <span class="desc-short">近期觸發的交易信號</span>
                </div>
            </div>
            <div id="signal-area" class="signal-list">
                <span class="skeleton" style="width: 100%; height: 60px;"></span>
                <span class="skeleton" style="width: 100%; height: 60px;"></span>
            </div>
        </section>

        <!-- Prediction Markets Card -->
        <section class="indicator-card glass-panel">
            <div class="card-header">
                <div class="title-group">
                    <h2>Polymarket 預測 <span class="badge">LIVE</span></h2>
                    <span class="desc-short">即時川普相關預測市場</span>
                </div>
            </div>
            <div id="pm-live-area" class="table-container">
                <span class="skeleton" style="width: 100%; height: 150px;"></span>
            </div>
        </section>

        <!-- Model Rankings Card -->
        <section class="indicator-card glass-panel">
            <div class="card-header">
                <div class="title-group">
                    <h2>模型排行 <span class="badge">AI</span></h2>
                    <span class="desc-short">驗證勝率最高的交易策略</span>
                </div>
            </div>
            <div id="model-area" class="table-container">
                <span class="skeleton" style="width: 100%; height: 200px;"></span>
            </div>
        </section>

    </main>
</div>

<script src="trump.js"></script>
</body>
</html>
